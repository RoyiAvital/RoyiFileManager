name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOCS_ENV: RoyiFileManager
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Verify Git LFS assets
        shell: pwsh
        run: |
          $icon = Get-Content docs/assets/icon.svg -Raw
          if ($icon.StartsWith('version https://git-lfs.github.com/spec/v1') -or
              $icon -notmatch '<svg(?:\s|>)') {
            throw 'docs/assets/icon.svg is not a materialized SVG file. Check Git LFS checkout.'
          }

      - name: Set up conda environment from lock file
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: conda-lock.yml
          environment-name: ${{ env.DOCS_ENV }}
          cache-environment: true
          cache-environment-key: docs-lock-${{ hashFiles('conda-lock.yml') }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate documentation screenshots
        shell: pwsh
        run: micromamba run -n $env:DOCS_ENV python src/misc/generate_docs_screenshots.py --mode source

      - name: Build documentation
        shell: pwsh
        run: micromamba run -n $env:DOCS_ENV python build.py doc

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
