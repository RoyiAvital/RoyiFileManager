site_name: RoyiFileManager
site_description: Fast, keyboard-focused file management for Windows.
site_url: https://royiavital.github.io/RoyiFileManager/
repo_url: https://github.com/RoyiAvital/RoyiFileManager
repo_name: RoyiAvital/RoyiFileManager
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Basics: basics.md
  - Features: features.md
  - Performance: performance.md
  - Main Tools: tools.md
  - Keyboard Shortcuts: shortcuts.md
  - Configuration: configuration.md
  - Search and Find: search.md
  - Plug-ins:
      - Your First Plug-in: plugins/index.md
      - API Overview: api/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - tables

extra_css:
  - stylesheets/extra.css

copyright: RoyiFileManager is based on fman 1.7.5.
