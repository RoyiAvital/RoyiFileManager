name: RoyiFileManager
channels:
  - conda-forge
dependencies:
  - python>=3.14,<3.15
  - pyqt=5.15.*
  - pyinstaller>=6,<7
  - pywin32
  - pywinpty
  - send2trash
  - tinycss2>=1.5,<2
  - requests
  - ripgrep
  - fzf #<! For testing only
  - fd-find #<! Find files with `fd` command
  - conda-lock
  - mkdocs-material #<! Downgrades `click` (https://github.com/conda-forge/mkdocs-feedstock/issues/55) run `micromamba update click --no-deps`